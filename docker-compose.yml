version: "3.9"

# ─── Shared network ───────────────────────────────────────────────────────────
networks:
  ainsights_net:
    driver: bridge

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  ollama_data:
  chroma_data:
  app_data:

services:

  # ── 1. Ollama (local LLM server) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ainsights_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ainsights_net
    # Pull model on startup if not already present
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull qwen2.5-coder:7b &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s   # model pull may take time on first boot

  # ── 2. FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ainsights_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - app_data:/app/backend/data
      - chroma_data:/app/backend/data/vectorstore
    networks:
      - ainsights_net
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Streamlit Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ainsights_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      BACKEND_URL: "http://backend:8000"
    networks:
      - ainsights_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5