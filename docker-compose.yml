name: ainsights

networks:
  ainsights_net:
    driver: bridge

volumes:
  app_data:

services:

  # ── Streamlit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ainsights
    restart: unless-stopped
    networks:
      - ainsights_net
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      BACKEND_URL:     "http://host.docker.internal:8000"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
