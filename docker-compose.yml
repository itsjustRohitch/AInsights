name: ainsights

networks:
  ainsights_net:
    driver: bridge

volumes:
  app_data:

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ainsights_backend
    restart: unless-stopped
    networks:
      - ainsights_net
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # host-gateway resolves to the Docker host's IP on all platforms
      OLLAMA_BASE_URL:    "http://host.docker.internal:11434"
      DATA_DIR:           "/app/data"
      UPLOAD_DIR:         "/app/data/uploads"
      CHROMA_PERSIST_DIR: "/app/data/vectorstore"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux requires this line
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Streamlit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ainsights_frontend
    restart: unless-stopped
    networks:
      - ainsights_net
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      BACKEND_URL:     "http://backend:8000"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # ── Nginx (optional) ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ainsights_nginx
    restart: unless-stopped
    networks:
      - ainsights_net
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy