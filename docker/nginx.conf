worker_processes  1;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Increase timeouts for long LLM calls
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    send_timeout          300s;
    client_max_body_size  100M;   # allow large file uploads

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:8501;
    }

    server {
        listen 80;
        server_name _;

        # Route /api/* to FastAPI backend
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # Route /docs and /redoc to FastAPI
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Everything else goes to Streamlit
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Streamlit WebSocket endpoint
        location /_stcore/stream {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}